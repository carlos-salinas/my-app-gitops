# Strategic-merge patch: env entries merge by name (MESSAGE / APP_VERSION stay from base).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgd
spec:
  template:
    spec:
      containers:
        - name: bgd
          env:
            - name: BG_COLOR
              value: "darkorange"
            - name: GIT_COMMIT
              value: "4e741aa80671242d0eac910a6b66166ef43265ce"
