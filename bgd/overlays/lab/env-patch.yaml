# Strategic-merge patch: env entries merge by name (MESSAGE / APP_VERSION stay from base).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgd
spec:
  template:
    spec:
      containers:
        - name: bgd
          env:
            - name: BG_COLOR
              value: "mediumseagreen"
            - name: GIT_COMMIT
              value: "708cbbdefc2959449b56fc5bb568b842e01ebabd"
