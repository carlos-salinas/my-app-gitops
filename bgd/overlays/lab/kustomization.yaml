apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# CI (gitops-change-image) rewrites images + env-patch.yaml each PipelineRun.
images:
  - name: quay.io/csalinas/bgd
    digest: sha256:b2ff09e9eabbb20341065a55d881003f246183db1b0dbbde4ed48c03e22a6856

patches:
  - path: env-patch.yaml
    target:
      kind: Deployment
      name: bgd
