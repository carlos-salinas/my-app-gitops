---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bgd
  name: bgd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bgd
  template:
    metadata:
      labels:
        app: bgd
    spec:
      containers:
      - name: bgd
        image: quay.io/csalinas/bgd:9747070b4ad4ed0bb4d2e877ac876f746db65e0e@sha256:c3401cc40eaeeae2db02fa703434575d392eba8f130fc3e05c0f64a44466b137
        # Mutable tags need Always; IfNotPresent keeps a stale arch after retag (Exec format error).
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: BG_COLOR
          value: "teal"
        - name: MESSAGE
          value: "OpenShift Pipelines+GitOps Demo"
        - name: APP_VERSION
          value: "1.0.0"
        - name: GIT_COMMIT
          value: "9747070b4ad4ed0bb4d2e877ac876f746db65e0e"
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
